schemaVersion: v1alpha1
name: Engineering
alias: eng
credentialStrategy: EXECUTOR
codeForges:
    - GITHUB
repositories:
    - owner: your-org
      name: your-repo
      codeForge: GITHUB
integrations:
    - type: jira
    - type: slack
github:
    mcpEnabled: true
workerDefaults:
    model: gpt-6-1-sol-high
    runner: default
blueprint:
    worker: Engineering Foreman
    start:
        to:
            - stage: research
              when: The request is a bounded informational question ("can we do X?", "do we support Y?", "how does Z work?") and not a follow-up on existing worker-owned work.
            - stage: work
              when: The request asks for a change, names a work item or PR, or needs tracking, reproduction, or scoping. Default.
    stages:
        research:
            description: Find answers to questions using relevant sources and evidence.
            worker: Engineering Researcher
            inputs: |-
                question: The user's exact question, separate from factual context.
                context: Relevant links, prior findings, and requester identity.
            outputs: |-
                outcome: one of answered or needs_worker.
                answer: The cited findings and open uncertainties.
            prompt:
                file: stages/research.md
            to:
                - stage: work
                  when: outcome is needs_worker; the question requires a change, a tracked issue, a reproduction, or more than a bounded read-only lookup, or the user asks for a change.
                - stage: end
                  when: outcome is answered; deliver the cited answer to the user and close out.
        work:
            description: Carry out the requested work and deliver the result.
            worker: Engineering Task-Worker
            inputs: |-
                request: The user's exact request or bounded automation authorization, separate from factual context.
                ownership: Persistent conversation, scope, branch/PR and explicit issue-status ownership; any existing-work discovery result.
                decisions: Already-resolved goal, approach and spec approval choices, with the user's words.
                artifacts: Existing findings, issue, spec, PR, review threads, validation and recoverable proof.
            outputs: |-
                result: one of answered, declined, or pr_delivered.
                artifacts: Issue/spec/PR references, checks, QA verdict and merge risk, remaining human decisions and visual-proof links.
                ownership: Retained conversation, branch, issue coverage and decisions for follow-ups.
            start:
                to:
                    - stage: spec
                      when: The requester asked for a spec or plan for a request whose cause and scope are already known.
                    - stage: review
                      when: The requester asked for a review of an existing PR, not a new implementation.
                    - stage: implement
                      when: Trivial work or an adopted work item skips triage with no spec needed, or a delivered PR needs a revision.
                    - stage: triage
                      when: The cause or scope is not yet known, the work needs a tracked issue, or the request may duplicate or follow up on existing work. Default.
            stages:
                triage:
                    description: Investigate the request and clarify its scope and next steps.
                    worker: Engineering Task-Worker
                    outputs: |-
                        goal: one of answer or change.
                        next: for goal change, one of spec or implement.
                        findings: Existing-work discovery, issue decision/reference, evidence, complexity, ambiguity and candidate approaches.
                        decisions: Every settled pre-work choice, from the request or the scoping answers, in the user's words.
                    prompt:
                        file: stages/triage.md
                    gates:
                        scoping:
                            when: The goal is unclear, or an ask on the pre-work-checks scoping checklist is open. Before the stage's work is done, only when the ask blocks research or reproduction.
                            prompt: Send every open ask as one batch, each with the findings that bear on it and your recommendation. Include every ask you can foresee, so the user answers once.
                            outputs: 'The user''s answer to each open ask, in their words: whether a change is wanted, the chosen or explicitly delegated approach, a spec, and each clarification. An instruction to proceed with asks unanswered settles them: take your recommendation for each unanswered choice.'
                    to:
                        - stage: end
                          when: goal is answer, or scoping answered that no change is wanted; the answer is the deliverable, or nothing further is owed.
                        - stage: spec
                          when: next is spec; the user agreed to a spec.
                        - stage: implement
                          when: next is implement; no ambiguity or decision needs a spec, and every applicable pre-work ask is resolved.
                spec:
                    description: Define the requirements and approach for approval.
                    worker: Engineering Task-Worker
                    inputs: 'contract: Request, triage findings or existing work item, agreed spec scope and resolved pre-work choices.'
                    outputs: |-
                        spec_pr: The draft PR holding the committed spec, on the branch implementation reuses, linked to the issue when present.
                        decisions: Interview decisions and recorded assumptions.
                    prompt:
                        file: stages/spec.md
                    gates:
                        scoping:
                            when: A new change entered this stage without triage and an ask on the pre-work-checks scoping checklist is open, before the stage's work begins.
                            prompt: Send every open ask as one batch, each with your recommendation. Include every ask you can foresee, so the user answers once.
                            outputs: 'The user''s answer to each open ask, in their words: whether a change is wanted, the chosen or explicitly delegated approach, a spec, and each clarification. An instruction to proceed with asks unanswered settles them: take your recommendation for each unanswered choice.'
                        approval:
                            when: A new or revised spec is committed to its draft PR.
                            prompt: Send the spec PR and ask for approval of this revision, in writing or on the draft PR.
                            outputs: approved, changes requested with the feedback, or declined.
                    to:
                        - stage: end
                          when: The user declined, at scoping or as the approval answer; nothing further is owed.
                        - stage: spec
                          when: approval is changes requested; revise the spec on the same branch and PR.
                        - stage: implement
                          when: approval is approved; the user approved the current revision and all applicable scoping asks are resolved.
                implement:
                    description: Build and verify the requested change.
                    worker: Engineering Task-Worker
                    inputs: |-
                        authorization: Requested change or bounded automation, settled approach, resolved scoping asks and approved spec when one exists.
                        revision: Existing branch/PR, actionable review or QA findings or CI evidence, and retained decisions.
                    outputs: |-
                        needs_triage: true only when work that was trivial now needs triage; otherwise false.
                        review_decision: one of review or skip.
                        change: Draft PR and issue reference, implementation or revision, validation results and proof links.
                    prompt:
                        file: stages/implement.md
                    gates:
                        scoping:
                            when: A new change entered this stage without triage and an ask on the pre-work-checks scoping checklist is open, before the stage's work begins.
                            prompt: Send every open ask as one batch, each with your recommendation. Include every ask you can foresee, so the user answers once.
                            outputs: 'The user''s answer to each open ask, in their words: whether a change is wanted, the chosen or explicitly delegated approach, a spec, and each clarification. An instruction to proceed with asks unanswered settles them: take your recommendation for each unanswered choice.'
                    to:
                        - stage: end
                          when: The user declined further work, at scoping or later; report the artifacts and obligations that remain open.
                        - stage: triage
                          when: needs_triage is true; work that was trivial became more complex than originally thought.
                        - stage: end
                          when: review_decision is skip; the change's full effect is obvious on sight, or the user explicitly asked to skip review.
                        - stage: review
                          when: review_decision is review; when in doubt, review. Default.
                review:
                    description: Check the change for correctness and quality.
                    worker: Engineering Task-Worker
                    outputs: |-
                        verdict: one of accepted, revision_needed, or human_decision_needed.
                        findings: Location, severity, problem, impact, correction and unambiguous/ambiguous classification for each finding.
                        delivery: Reviewed PR, checks, remaining human decisions and proof; whether a human-facing review was posted.
                    prompt:
                        file: stages/review.md
                    to:
                        - stage: qa
                          when: verdict is accepted or human_decision_needed, on a PR this factory opened; the readied PR gets an independent QA pass before it goes to the user.
                        - stage: end
                          when: verdict is accepted or human_decision_needed, on a review-only entry for a PR this factory did not open; the posted review is the result.
                        - stage: implement
                          when: verdict is revision_needed; only unambiguous findings, applied as the review wrote them.
                qa:
                    description: Run the change and assess merge risk, independently of the worker that wrote it.
                    worker: Engineering QA
                    inputs: |-
                        pr: The PR to check, with its head commit.
                        context: The issue and the spec when they exist, the author's verification report, the review outcome, and how many QA rounds this PR has had.
                    outputs: |-
                        verdict: one of pass, fail, or not_reached.
                        report_url: The QA report comment on the PR, for the head commit that was checked.
                        findings: For fail, each failed check with what was expected, what happened, and how to see it.
                        merge_risk: one of low, medium, or high, with the main reason.
                        proof: Links to the QA captures, when a user interface was operated.
                    prompt:
                        file: stages/qa.md
                    to:
                        - stage: implement
                          when: verdict is fail and this PR has had fewer than two QA rounds; revise the same PR from the findings.
                        - stage: end
                          when: verdict is pass or not_reached, or two QA rounds have run; the PR goes to the user with the QA report and any open failure stated.
            gates:
                handoff:
                    when: result is pr_delivered, or a delivered PR is still open when the worker reports another result.
                    prompt: 'Present every delivered PR that awaits a human: its link, CI''s current result stated accurately, the factory self-review outcome and any findings left for human judgment, the QA verdict and merge risk when QA ran, and one visual proof file when the work was verified visually. Ask the requester for a merge decision. A human decides whether and when to merge.'
                    outputs: 'The outcome for each delivered PR: merged, closed without merge, or more work needed. More work needed is anything arriving for the PR that the worker must act on, from a person or an automation, with its exact content. Answer as soon as any PR needs more work; otherwise only when every PR has merged or closed. An approval with nothing to act on, a question, or an administrative follow-up is not an answer.'
            to:
                - stage: work
                  when: handoff is more work needed for any delivered PR; pass what arrived, verbatim, to the same worker conversation.
                - stage: end
                  when: result is answered or declined with no delivered PR still open, or handoff is merged or closed without merge for every delivered PR.
        security:
            description: Find dependency advisories, decide whether each one affects the repository, and open the smallest verified upgrade.
            worker: Engineering Security
            inputs: |-
                advisory: The CVE or advisory with its package, affected versions, severity and references, or the instruction to run a scheduled audit.
                context: The issue when one exists, earlier outcomes for the same advisory, and review findings or CI evidence when this is a revision.
            outputs: |-
                result: one of pr_delivered or no_action.
                outcome: one of affected, not_affected, or no_credible_fix, when an advisory was assessed.
                artifacts: The issue, the upgrade PR and its checks, and any decision left for a human.
            start:
                to:
                    - stage: patch
                      when: 'A follow-up on a PR this lane already delivered: a CI failure or review feedback.'
                    - stage: audit
                      when: A scheduled dependency audit with no specific advisory named.
                    - stage: assess
                      when: A specific advisory. Default.
            stages:
                audit:
                    description: Scan the repository's dependencies for known advisories and file the ones that are new.
                    worker: Engineering Security
                    outputs: |-
                        advisory: The one advisory to assess now, with its issue, or none.
                        filed: The issues created in this run.
                        skipped: Findings left out, each with the reason.
                    prompt:
                        file: stages/audit.md
                    to:
                        - stage: assess
                          when: advisory names one to assess now.
                        - stage: end
                          when: advisory is none; nothing new was found and no earlier advisory is waiting.
                assess:
                    description: Decide whether the advisory affects the repository and what a credible fix is.
                    worker: Engineering Security
                    outputs: |-
                        outcome: one of affected, not_affected, or no_credible_fix.
                        brief: When affected, the target versions, the compatibility changes to expect, and the residual risk.
                    prompt:
                        file: stages/assess.md
                    to:
                        - stage: patch
                          when: outcome is affected.
                        - stage: end
                          when: outcome is not_affected or no_credible_fix; the assessment on the issue is the result.
                patch:
                    description: Open the smallest verified dependency upgrade as a draft PR.
                    worker: Engineering Security
                    outputs: 'pr: The draft PR, labeled for this lane, with the advisory, the version changes, the residual risk and the evidence.'
                    prompt:
                        file: stages/patch.md
                    to: security-review
                security-review:
                    description: Check the upgrade for correctness and quality.
                    worker: Engineering Security
                    outputs: |-
                        verdict: one of accepted, revision_needed, or human_decision_needed.
                        findings: Location, severity, problem, impact, correction and unambiguous/ambiguous classification for each finding.
                        delivery: Reviewed PR, checks, remaining human decisions and proof; whether a human-facing review was posted.
                    prompt:
                        file: stages/review.md
                    to:
                        - stage: end
                          when: verdict is accepted or human_decision_needed; the PR goes to a human, with any findings that need one already posted.
                        - stage: patch
                          when: verdict is revision_needed; only unambiguous findings, applied as the review wrote them.
            gates:
                handoff:
                    when: result is pr_delivered, or a delivered PR is still open when the lane reports another result.
                    prompt: 'Present every delivered PR that awaits a human: its link, CI''s current result stated accurately, the advisory it resolves and the risk that remains, the self-review outcome and any findings left for human judgment, and what a human should check before merging. Ask the requester for a merge decision; when an automation started the work, ask where its instructions say results go. A human decides whether and when to merge.'
                    outputs: 'The outcome for each delivered PR: merged, closed without merge, or more work needed. More work needed is anything arriving for the PR that the lane''s worker must act on, from a person or an automation, with its exact content. Answer as soon as any PR needs more work; otherwise only when every PR has merged or closed. An approval with nothing to act on, a question, or an administrative follow-up is not an answer.'
            to:
                - stage: security
                  when: handoff is more work needed for any delivered PR; pass what arrived, verbatim, to the same security conversation.
                - stage: end
                  when: result is no_action with no delivered PR still open, or handoff is merged or closed without merge for every delivered PR.
        respond:
            description: Confirm that something is broken right now, find the change that caused it, and open a revert or a bounded fix.
            worker: Engineering Responder
            inputs: |-
                signal: What arrived, in its own words, with every link: the failed workflow run on the default branch, or the post in the incident channel.
                context: What is already known: when it started, the issue if one exists, earlier findings for the same problem, and review findings or CI evidence when this is a revision.
            outputs: |-
                result: one of pr_delivered or no_action.
                cause: The change that caused the problem, with the evidence, or none found.
                artifacts: The issue, the revert or fix PR and its checks, and any decision left for a human.
            start:
                to:
                    - stage: fix
                      when: 'A follow-up on a PR this lane already delivered: a CI failure or review feedback.'
                    - stage: confirm
                      when: A new signal. Default.
            stages:
                confirm:
                    description: Check that the problem is real and still happening, and record it.
                    worker: Engineering Responder
                    outputs: |-
                        confirmed: one of yes, no, or already_owned, with the evidence.
                        started: When it started and the last state known to be good, as far as the evidence shows.
                        issue: The issue that tracks this problem, created or adopted, or the open issue this signal joined.
                    prompt:
                        file: stages/confirm.md
                    to:
                        - stage: investigate
                          when: confirmed is yes.
                        - stage: end
                          when: confirmed is no or already_owned; the evidence, or the issue the signal joined, is the result.
                investigate:
                    description: Find the change that caused the problem and decide between a revert, a fix, and a human call.
                    worker: Engineering Responder
                    outputs: |-
                        cause: The offending change with the evidence that ties it to the problem, a cause outside the repository's history, or none.
                        decision: one of revert, fix, human, or no_cause.
                        brief: For revert or fix, the change to undo or the root cause to correct, and the check that proves the problem is gone.
                    prompt:
                        file: stages/investigate.md
                    gates:
                        human:
                            when: 'decision is human: the evidence points at a suspect but does not prove it, the remedy would be hard to undo, a revert does not apply cleanly, or the fix needs a product decision.'
                            prompt: Put the evidence and the options (revert, fix forward, or leave as is) to a human, with the risk of each and your recommendation.
                            outputs: revert, fix, or leave as is, in the human's words.
                    to:
                        - stage: fix
                          when: decision is revert or fix, or the human answer is revert or fix.
                        - stage: end
                          when: decision is no_cause, or the human answer is leave as is; what was checked is the result.
                fix:
                    description: Open the revert or the bounded fix as a draft PR.
                    worker: Engineering Responder
                    outputs: |-
                        pr: The draft PR, labeled for this lane, with the evidence in its description.
                        kind: one of revert or fix.
                        verification: What was run and what it proved.
                    prompt:
                        file: stages/fix.md
                    to: respond-review
                respond-review:
                    description: Check the revert or fix for correctness and quality.
                    worker: Engineering Responder
                    outputs: |-
                        verdict: one of accepted, revision_needed, or human_decision_needed.
                        findings: Location, severity, problem, impact, correction and unambiguous/ambiguous classification for each finding.
                        delivery: Reviewed PR, checks, remaining human decisions and proof; whether a human-facing review was posted.
                    prompt:
                        file: stages/review.md
                    to:
                        - stage: end
                          when: verdict is accepted or human_decision_needed; the PR goes to a human, with any findings that need one already posted.
                        - stage: fix
                          when: verdict is revision_needed; only unambiguous findings, applied as the review wrote them.
            gates:
                handoff:
                    when: result is pr_delivered, or a delivered PR is still open when the lane reports another result.
                    prompt: 'Present every delivered PR that awaits a human: its link, CI''s current result stated accurately, the problem, its cause and the evidence that ties them together, the self-review outcome and any findings left for human judgment, and what a human should check before merging. Ask the requester for a merge decision; when an automation started the work, ask where its instructions say results go. A human decides whether and when to merge.'
                    outputs: 'The outcome for each delivered PR: merged, closed without merge, or more work needed. More work needed is anything arriving for the PR that the lane''s worker must act on, from a person or an automation, with its exact content. Answer as soon as any PR needs more work; otherwise only when every PR has merged or closed. An approval with nothing to act on, a question, or an administrative follow-up is not an answer.'
            to:
                - stage: respond
                  when: handoff is more work needed for any delivered PR; pass what arrived, verbatim, to the same responder conversation.
                - stage: end
                  when: result is no_action with no delivered PR still open, or handoff is merged or closed without merge for every delivered PR.
        ops:
            description: Digests and reminders the foreman posts itself. No code changes and no other worker.
            worker: Engineering Foreman
            inputs: 'instructions: The automation''s instructions, exactly as written.'
            outputs: 'posted: What was posted and where, or that nothing needed posting.'
            prompt:
                file: stages/ops.md
            to: end
